name: Deploy AdonisJS to Hostinger

on:
  push:
    branches: [ prod ]  # Déployer lors d'un push sur 'prod'
  workflow_dispatch:      # Permettre le déclenchement manuel

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Prepare build/tmp for restart
        run: mkdir -p build/tmp

      - name: Upload Files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_IP }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_AUTO_AB_SSH_KEY }}
          port: 65002
          source: "build/*"
          target: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
          strip_components: 1 # Enlève le préfixe 'build/' pour copier directement le contenu dans la destination

      - name: SSH Post-Deployment Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_IP }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_AUTO_AB_SSH_KEY }}
          port: 65002
          script: |
            cd ${{ secrets.HOSTINGER_DEPLOY_PATH }}
            
            # Installer les dépendances de production sur le serveur
            npm ci --omit=dev
            
            # Exécuter les migrations si nécessaire
            if [ -f "ace" ]; then
              node ace migration:run --force
            fi
            
            # Redémarrer l'application (pour le sélecteur Node.js cPanel / Passenger)
            touch tmp/restart.txt
